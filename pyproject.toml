[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-webchanel"
version = "0.1.1"
description = "Bidirectional context and message channel between Local Agent (AGY) and Gemini Web via Google Drive (.agywc)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "ABCodeLabs", email = "dev@abco.dev" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pathspec>=0.11.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "nuitka>=2.0.0",
    "pip-licenses>=4.3.0",
]

[project.urls]
Homepage = "https://abco.dev"
Repository = "https://github.com/ABCodeLabs/agy-webchanel"

[project.scripts]
agywc = "agy_webchanel.cli:app"
agy-webchanel = "agy_webchanel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

